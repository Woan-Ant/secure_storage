name: secure_storage
description: >-
  Encrypted key-value storage for Flutter, layering Hive CE boxes on top of
  Flutter Secure Storage. Per-box AES keys are generated by Hive and held in the
  platform keystore, with a repository and use-case API on top.
version: 0.1.0
# TODO(maintainer): replace with the real repository before publishing.
repository: https://github.com/bpbunthoeun/secure_storage
issue_tracker: https://github.com/bpbunthoeun/secure_storage/issues
topics:
  - storage
  - encryption
  - hive
  - security

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  equatable: ^2.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=10.3.0 <12.0.0"
  fpdart: ^1.1.0
  get_it: ^9.0.0
  hive_ce: ^2.19.0
  path_provider: ^2.1.0
  synchronized: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.0
  very_good_analysis: ^10.3.0
