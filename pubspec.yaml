name: secure_storage
description: >-
  Encrypted key-value storage for Flutter, layering Hive CE boxes on Flutter
  Secure Storage. Each encrypted box gets an AES key held in the platform
  keystore.
version: 0.1.0
repository: https://github.com/bpbunthoeun/secure_storage
issue_tracker: https://github.com/bpbunthoeun/secure_storage/issues
topics:
  - storage
  - encryption
  - hive
  - security

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  dartz: ^0.10.1
  equatable: ^2.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=10.3.0 <12.0.0"
  get_it: ^9.0.0
  hive_ce: ^2.19.0
  synchronized: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0
