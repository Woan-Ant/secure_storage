name: secure_storage
description: >-
  Encrypted key-value storage for Flutter, layering Hive CE boxes on Flutter
  Secure Storage. Each encrypted box gets an AES key held in the platform
  keystore.
version: 0.1.0
repository: https://github.com/bpbunthoeun/secure_storage
issue_tracker: https://github.com/bpbunthoeun/secure_storage/issues
topics:
  - storage
  - encryption
  - hive
  - security

environment:
  sdk: 3.13.5
  flutter: 3.47.6

dependencies:
  dartz: 0.10.1
  equatable: 3.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  get_it: 9.3.0
  hive_ce: 2.20.1
  synchronized: 3.4.2
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  very_good_analysis: 11.0.0
