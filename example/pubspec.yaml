name: secure_storage_example
description: Demonstrates reading, writing and deleting encrypted entries with the secure_storage package.
version: 1.0.0
publish_to: none

environment:
  sdk: 3.13.5
  flutter: 3.47.6

dependencies:
  bloc: 9.2.1
  equatable: 3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_secure_storage: 11.2.0
  get_it: 9.3.0
  path_provider: 2.1.6
  secure_storage:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
